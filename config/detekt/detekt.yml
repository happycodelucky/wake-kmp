# Wake — detekt overrides on top of the default config (CLAUDE.md §3).
#
# `buildUponDefaultConfig = true` is set in the root build script, so this file
# only needs to record DEVIATIONS from detekt's defaults. Two rules are relaxed
# for TEST sources only — test code conventionally uses descriptive backtick /
# underscore method names and inline literals, neither of which is a smell in a
# test; production code stays held to the strict defaults. MaxLineLength is off:
# ktlint owns the line length (.editorconfig).

style:
  MagicNumber:
    # Test sources may use literal constants freely; the assertion *is* the spec.
    excludes:
      - "**/commonTest/**"
      - "**/androidHostTest/**"
      - "**/*Test.kt"
  MaxLineLength:
    # ktlint enforces the line length from the root .editorconfig (140), the
    # single place the number lives; a second copy here could drift from it.
    active: false

naming:
  FunctionNaming:
    # Allow descriptive test method names (underscores / backticks).
    excludes:
      - "**/commonTest/**"
      - "**/androidHostTest/**"
      - "**/*Test.kt"
