# Template sync state — maintained with the paul-template-sync skill.
#
# last_synced is the template commit this repo has been reconciled against: every template
# change up to it was adopted, adapted, or deliberately skipped (see [[decision]] / [[ignore]]).
# Advance it only with `template_sync.py record`, in the same PR that lands the sync.

[template]
repo = "https://github.com/happycodelucky/kmp-template"
branch = "main"
last_synced = "3c348be806dced96c5d5a98809f73ff9d8f82f2b"
last_synced_date = "2026-09-27"

# Render map: how template paths and text read in this repo. Generated from the template's
# scripts/init.sh rules; edit it where this repo deliberately differs. Replacements are
# literal and applied in order; path rules are regexes applied in order.
[render]
name = "wake"
display_name = "Wake"
framework = "WakeKit"
group = "com.happycodelucky"
org = "happycodelucky"
repo_name = "wake-kmp"

[[render.replace]]
from = "github.com/happycodelucky/__PROJECT_NAME__"
to = "github.com/happycodelucky/wake-kmp"

[[render.replace]]
from = "__REPO__"
to = "wake-kmp"

[[render.replace]]
from = "__PROJECT_NAME__"
to = "wake"

[[render.replace]]
from = "__DISPLAY_NAME__"
to = "Wake"

[[render.replace]]
from = "__FRAMEWORK__"
to = "WakeKit"

[[render.replace]]
from = "template.kmp-library"
to = "wake.kmp-library"

[[render.replace]]
from = "template.publish"
to = "wake.publish"

[[render.replace]]
from = "LIBRARY_VERSION"
to = "WAKE_VERSION"

[[render.replace]]
from = "com.happycodelucky.src.testing"
to = "com.happycodelucky.wake.testing"

[[render.replace]]
from = "com.happycodelucky.src.example"
to = "com.happycodelucky.wake.example"

[[render.replace]]
from = "com.happycodelucky.src.cli"
to = "com.happycodelucky.wake.cli"

[[render.replace]]
from = "com.happycodelucky.src"
to = "com.happycodelucky.wake"

[[render.replace]]
from = "build:src"
to = "build@@SRCTASK@@"

[[render.replace]]
from = ":src-testing"
to = ":wake-testing"

[[render.replace]]
from = ":src"
to = ":wake"

[[render.replace]]
from = "build@@SRCTASK@@"
to = "build:src"

[[render.replace]]
from = "assembleSrcXCFramework"
to = "assembleWakeKitXCFramework"

[[render.replace]]
from = "src-testing/build"
to = "wake-testing/build"

[[render.replace]]
from = "src-testing/api"
to = "wake-testing/api"

[[render.replace]]
from = "src/build"
to = "wake/build"

[[render.replace]]
from = "src/api"
to = "wake/api"

[[render.replace]]
from = "if-no-files-found: warn"
to = "if-no-files-found: error"

[[render.path]]
from = "^src-testing/"
to = "wake-testing/"

[[render.path]]
from = "^src/"
to = "wake/"

[[render.path]]
from = "/com/happycodelucky/src(/|$)"
to = "/com/happycodelucky/wake\\1"

[[render.path]]
from = "^gradle/plugins/src/main/kotlin/template\\."
to = "gradle/plugins/src/main/kotlin/wake."

# Standing decisions: template paths this repo deliberately does not carry.
[[ignore]]
path = "TEMPLATE.md"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "scripts/init.sh"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "scripts/template-manifest.txt"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "apps/*"
reason = "No sample apps; wake's only sample is its own :apps:cli (CLAUDE.md §4)."

[[ignore]]
path = "docs/*"
reason = "No mkdocs site — removed deliberately (cf960b2); Dokka HTML only (`mise run docs`)."

[[ignore]]
path = "mkdocs.yml"
reason = "No mkdocs site (cf960b2)."

[[ignore]]
path = "main.py"
reason = "mkdocs macros — no docs site here."

[[ignore]]
path = ".github/workflows/docs.yml"
reason = "No docs site / Pages deploy here."

[[ignore]]
path = "src/src/*"
reason = "Template placeholder library code (Greeter/Platform) — wake has its own API."

[[ignore]]
path = "src/api/*"
reason = "Template placeholder ABI dumps."

[[ignore]]
path = "src-testing/src/*"
reason = "Template placeholder test fakes — wake has FakeWake."

[[ignore]]
path = "src-testing/api/*"
reason = "Template placeholder ABI dumps."

[[ignore]]
path = "scripts/release.sh"
reason = "By-hand publishing (`publish:maven`) not carried: publishing is CI-only here (CLAUDE.md §9)."

