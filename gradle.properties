# Wake — Gradle properties (CLAUDE.md §10).

# The library version: the last version RELEASED from main. Don't edit it by
# hand — the Release PR workflow bumps it from the pending .changeset/ files
# (scripts/changeset.py; .github/PUBLISHING.md), and merging that PR publishes
# exactly this value. (0.1.0 is the v0.1 GitHub release; 1.0.0-rc.1 was a
# pre-release, which never lands here.)
version=0.1.0

# Configuration cache + build cache. CLAUDE.md §10: "Don't disable."
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Memory. KMP + SKIE need a non-trivial heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Kotlin K2 is the only mode we support (CLAUDE.md §2: "K2 only. No K1 fallback").
kotlin.code.style=official

# Android.
android.useAndroidX=true
android.nonTransitiveRClass=true
