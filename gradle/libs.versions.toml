# =============================================================================
# Wake — single source of truth for dependency versions (CLAUDE.md §10).
#
# IMPORTANT (CLAUDE.md §2 / §12): before bumping any version, web-search the
# latest stable. Versions in training data go stale fast. Stable only on `main`
# (no EAP / RC / Beta). The Kotlin pin is bounded above by SKIE's supported
# range — do not bump Kotlin past what SKIE supports.
#
# NAMING: every key, in every section, is lowercase kebab-case. Dashes become
# nested accessors (`android-compile-sdk` → libs.versions.android.compile.sdk),
# so a key must never be a whole-segment prefix of another: adding
# `ktlint-gradle` beside `ktlint` turns libs.versions.ktlint into a group and
# breaks `.get()`. Name siblings by artifact instead (ktlint-cli, ktlint-gradle).
# =============================================================================

[versions]

# --- Toolchain --------------------------------------------------------------
# HELD at 2.4.10: the highest Kotlin SKIE 0.10.14 supports (its
# versionSupport.kotlin ends at 2.4.0(2.4.10)). Kotlin 2.4.20 is out; SKIE's
# 2.4.20 support is in flight at https://github.com/touchlab/SKIE/pull/202
# (tracked by touchlab/SKIE#205). CLAUDE.md §8: don't bump Kotlin past SKIE's
# supported range. The hold is also encoded in renovate.json5 and in the
# `versionCatalogUpdate { pin }` block of the root build script.
kotlin = "2.4.10"
# com.android.kotlin.multiplatform.library variant (CLAUDE.md §2). AGP 9.4
# requires Gradle >= 9.6.0.
agp = "9.4.1"
# Supports Kotlin 2.0.0 – 2.4.10.
skie = "0.10.14"
# XCFramework → GitHub Release asset → SPM (CLAUDE.md §9).
kmmbridge = "1.2.1"
# Kotlin API doc generator; Dokka v2 task layout.
dokka = "2.2.0"
# vanniktech's gradle-maven-publish-plugin — publishes signed artifacts to the
# Sonatype Central Portal (central.sonatype.com). Floor: JDK 17 / Gradle 9 /
# AGP 8.13 / KGP 2.2; officially supports com.android.kotlin.multiplatform.library
# publications. Coexists with KMMBridge — vanniktech owns Maven Central,
# KMMBridge owns the GitHub Release asset + Package.swift, and each has its own
# publish-umbrella task, so there's no cross-contamination.
maven-publish = "0.37.0"

# --- Dependency management (mise dependencies:outdated / dependencies:update) -
# ben-manes (`dependencyUpdates`) REPORTS available updates;
# version-catalog-update (`versionCatalogUpdate`) REWRITES this file in place.
# They are independent: VCU >= 1.0 resolves versions itself and does not read
# ben-manes' output. Both are configured stable-only in the root build script.
# Verified latest stable on the Gradle Plugin Portal 2026-09-23.
ben-manes-versions = "0.64.0"
version-catalog-update = "1.1.1"

# --- Build health / dependency hygiene --------------------------------------
# dependency-analysis: flags unused deps, api-vs-implementation misuse, and
# transitive deps you rely on directly. Run via `mise run dependencies:analyze`.
# gradle-doctor: build-health warnings (slow config, JVM mismatches, cache
# misses). Both verified latest stable on the Gradle Plugin Portal 2026-09-23.
# dependency-analysis 3.19.2 imports kotlin-bom 2.4.0 onto the shared build
# classpath: with a Kotlin Gradle plugin older than 2.4 that upgrades
# kotlin-daemon-client under KGP and breaks its compiler-daemon connection
# (NoSuchMethodError, silent fallback to in-process compilation). Keep Kotlin
# >= 2.4 while on this line.
dependency-analysis = "3.19.2"
gradle-doctor = "0.12.1"

# --- Android SDK ------------------------------------------------------------
android-compile-sdk = "36"
# arm64-v8a only (CLAUDE.md §1).
android-min-sdk = "30"
# Bytecode level for the jvm AND android targets (CLAUDE.md §2) — a consumer
# contract, set explicitly by the convention plugin; independent of the JDK
# that runs the build.
jvm-target = "21"

# --- Apple deployment targets ----------------------------------------------
ios-deployment-target = "18.0"
macos-deployment-target = "15.0"

# --- kotlinx ----------------------------------------------------------------
kotlinx-coroutines = "1.11.0"
kotlinx-atomicfu = "0.33.0"

# --- Lint ------------------------------------------------------------------
# The ktlint tool itself (com.pinterest.ktlint:ktlint-cli).
ktlint-cli = "1.8.0"
# The org.jlleitschuh.gradle.ktlint Gradle plugin.
ktlint-gradle = "14.2.0"
# detekt 1.23.8 is the latest stable; the 2.x line (new plugin id dev.detekt)
# is still alpha as of September 2026 and CLAUDE.md §2 bans pre-stable on main.
detekt = "1.23.8"


[libraries]

# --- kotlinx ----------------------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }

# --- Gradle plugin artifacts (build-logic only) ------------------------------
# Compile-classpath dependencies for the precompiled convention plugins under
# /gradle/plugins. Same version refs as the [plugins] aliases below, so the main
# build and build-logic can never apply different plugin versions.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
# SKIE's plugin marker artifact — resolves to the real plugin jar without
# hard-coding Touchlab's internal artifact name.
skie-gradle-plugin = { module = "co.touchlab.skie:co.touchlab.skie.gradle.plugin", version.ref = "skie" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
vanniktech-maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }


[plugins]

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# kotlin-jvm — applied by the sample :apps:cli module only (a plain JVM app, not
# a published KMP library). Same `kotlin` version as the multiplatform plugin
# (same Kotlin Gradle artifact), so the two can never diverge.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# kmmbridge-github — applied in wake/build.gradle.kts. Publishes the
# SKIE-enhanced WakeKit.xcframework zip as a GitHub *Release* asset (public,
# unauthenticated download — unlike GitHub Packages, which requires a PAT even
# on public repos) and regenerates the root Package.swift to reference it by
# URL + checksum. See the `kmmbridge { }` block in wake/build.gradle.kts
# and the SPM steps in .github/workflows/release.yml.
# The kmmbridge-github artifact is a superset of the core kmmbridge plugin
# in 1.2.x — applying both produces a duplicate-extension error.
kmmbridge-github = { id = "co.touchlab.kmmbridge.github", version.ref = "kmmbridge" }
# Vanniktech Maven Publish — Maven Central Portal upload + GPG signing + sources/
# javadoc jars + POM-metadata DSL. Configured in the `wake.publish` convention
# plugin (gradle/plugins); modules add only POM name/description.
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
# Dependency-update tooling (mise dependencies:outdated / dependencies:update).
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "ben-manes-versions" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
# Build-health tooling (mise dependencies:analyze / build:doctor).
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
gradle-doctor = { id = "com.osacky.doctor", version.ref = "gradle-doctor" }
